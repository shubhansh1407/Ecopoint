spring.application.name=ecopoint-platform
server.port=${PORT:8080}

# MySQL Database Configuration (Supports Local, Render, and Railway out of the box)
spring.datasource.url=jdbc:mysql://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:ecopoint_db}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Demo Login Feature Toggle (Default: true for local/demo, disable via DEMO_SWITCH_ENABLED=false in production)
ecopoint.demo.switch-enabled=${DEMO_SWITCH_ENABLED:true}

# Session Cookie Security (Mitigates XSS cookie theft and CSRF in modern browsers)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
