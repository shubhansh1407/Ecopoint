<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Ecopoint — Gamified Waste Segregation Platform">
  <meta name="theme-color" content="#66835B">
  <title>Sign In — Ecopoint Platform</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">

  <div style="width: 100%; max-width: 480px;">
    <!-- Logo & Title -->
    <div style="text-align: center; margin-bottom: 28px;">
      <a href="/index.html" style="text-decoration: none; display: inline-flex; align-items: center; gap: 12px; color: var(--text-primary);">
        <div class="logo-badge" style="width: 46px; height: 46px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
        </div>
        <div style="text-align: left;">
          <h1 style="font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em;">Ecopoint</h1>
          <p style="font-size: 0.75rem; color: var(--color-primary); font-weight: 600; text-transform: uppercase;">Sign In to Portal</p>
        </div>
      </a>
    </div>

    <!-- Login Glass Card -->
    <div class="glass-card" style="padding: 32px;">
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 6px;">Welcome Back</h2>
      <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 22px;">Access your traceability timeline and rewards.</p>

      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-color); font-size: 0.88rem; color: var(--text-secondary);">
        Don't have an account? <a href="/register.html" style="color: var(--color-primary); font-weight: 600; text-decoration: none;">Create Citizen Account</a>
      </div>
    </div>

    <!-- Theme switcher & Back to home -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 0 10px;">
      <a href="/index.html" style="font-size: 0.85rem; color: var(--text-secondary); text-decoration: none; font-weight: 500;">← Back to Landing Page</a>
      <button class="theme-toggle-btn" onclick="Common.toggleTheme()" aria-label="Toggle theme">
        <span id="theme-icon"></span>
      </button>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script>
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const user = await API.auth.login({ email, password });
        Common.showToast(`Welcome back, ${user.fullName}!`, 'success');
        setTimeout(() => Common.redirectToRoleHome(user.role), 300);
      } catch (err) {
        Common.showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
